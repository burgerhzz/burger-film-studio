<!doctype html><meta charset="utf-8">
<!-- 重點字卡展示動畫：黑底 3×2 六宮格，六種文字特效同時循環。白＋黃為主（照 EP5 字卡），部分換亮色與不同字體。
     window.setT(t) 畫出任一時間點；整支 8 秒，每格的週期都能整除 8，頭尾可以無縫循環 -->
<style>
@font-face{font-family:SH;src:url("FONT_URL")}
html,body{margin:0;width:1920px;height:1080px;background:#000;overflow:hidden;color:#fff}
.cell{position:absolute;width:640px;height:540px;overflow:hidden;box-shadow:inset 0 0 0 1px #1c1c1c}
.tag{position:absolute;left:30px;bottom:26px;font:500 15px/1 "Helvetica Neue",sans-serif;letter-spacing:.14em;color:#666}
.tag b{color:#fff;font-weight:600;margin-right:10px}
.tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffe600;margin-right:9px;vertical-align:1px}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;white-space:nowrap}
/* 01 螢光筆 */
.c1 .mid{font-family:SH;font-size:54px;line-height:1.15}
.hl{position:relative;display:inline-block;padding:0 .08em}
.hl .band{position:absolute;left:-.04em;right:-.04em;top:.05em;height:1.12em;background:#ffe600;clip-path:polygon(2% 8%,100% 0,98% 92%,0 100%);transform-origin:0 50%}
.hl .tx{position:relative}
.hl .tx2{position:absolute;left:.08em;top:0;color:#000}
/* 02 合併 */
.mg{position:absolute;left:0;right:0;top:50%;margin-top:-.6em;font-family:'jf-jinxuan';font-weight:800;font-size:62px;line-height:1.2;text-align:center;white-space:nowrap}
.mg b{font-weight:inherit;color:#ffe600}
/* 03 空心字 */
.ol{position:absolute;left:64px;font-family:'Mantou Sans';font-size:86px;line-height:1;white-space:nowrap;color:transparent;-webkit-text-stroke:2px #fff;
  background:linear-gradient(#fff,#fff) no-repeat 0 0/0% 100%;-webkit-background-clip:text;background-clip:text}
/* 04 打字（列點） */
.ty{position:absolute;left:58px;top:50%;transform:translateY(-50%);display:grid;gap:18px;font-family:'GenSenRounded2 TW';font-weight:900;font-size:44px;line-height:1.1;white-space:nowrap}
.ty .k{color:#3ee0ff}
.tyl{min-height:1.1em}
.tyl:before{content:'';display:inline-block;width:.32em;height:.32em;border-radius:50%;background:#ffe600;margin-right:.45em;vertical-align:.22em}
.cur{display:inline-block;width:4px;height:.95em;background:#ffe600;margin-left:6px;vertical-align:-.1em}
/* 05 漂浮、06 波浪 */
.ch{display:inline-block}
.c5 .mid{font-family:'Iansui';font-size:60px}
.c5 .ch{text-shadow:0 0 14px rgba(255,120,190,.75),0 0 34px rgba(255,120,190,.4)}
.c5 .y{color:#ffe600}
.c6 .mid{font-family:'Mantou Sans';font-size:66px}
</style>
<div id="root"></div>
<script>
const ease3=x=>1-Math.pow(1-x,3), ease5=x=>1-Math.pow(1-x,5), io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, cl=x=>Math.max(0,Math.min(1,x));
const root=document.getElementById('root');
const split=s=>[...s].map(c=>c===' '?'&nbsp;':`<span class="ch">${c}</span>`).join('');
const cell=(n,name,html)=>{const d=document.createElement('div');d.className='cell c'+n;d.style.left=((n-1)%3*640)+'px';d.style.top=(Math.floor((n-1)/3)*540)+'px';
  d.innerHTML=html+`<div class="tag"><i></i><b>0${n}</b>${name}</div>`;root.appendChild(d);return d};
const LINES=['族群一　高強度運動、重訓','族群二　高齡熟齡長輩','族群三　外食族、食量小'];
const T2='<b>成人</b>每公斤 1.1 克';
const c1=cell(1,'HIGHLIGHTER　螢光筆劃記',`<div class="mid">先算出<span class="hl"><span class="band"></span><span class="tx">一天需要多少</span><span class="tx2">一天需要多少</span></span></div>`);
const c2=cell(2,'MERGE　合併',`<div class="mg" id="m1" style="clip-path:inset(0 0 50% 0)">${T2}</div><div class="mg" id="m2" style="clip-path:inset(50% 0 0 0)">${T2}</div>`);
const c3=cell(3,'OUTLINE FILL　空心字填滿',`<div class="ol" id="o1" style="top:170px;-webkit-text-stroke-color:#ffe600;background-image:linear-gradient(#ffe600,#ffe600)">3 種人</div><div class="ol" id="o2" style="top:280px">適合補蛋白粉</div>`);
const c4=cell(4,'TYPING　打字列點',`<div class="ty">${LINES.map(()=>`<div class="tyl"><span class="tw"></span><span class="cur"></span></div>`).join('')}</div>`);
const c5=cell(5,'FLOAT DRIFT　漂浮',`<div class="mid">${split('睡眠休息也是增肌關鍵')}</div>`);
const c6=cell(6,'WAVE LETTERS　波浪文字',`<div class="mid">${split('蛋白粉不是智商稅')}</div>`);
[...c5.querySelectorAll('.ch')].slice(-4).forEach(e=>e.classList.add('y'));
// 漂浮：每字週期 8/3 或 4 秒（都能整除 8），相位、幅度各不同
const fch=[...c5.querySelectorAll('.ch')].map((e,i)=>({e,p:i%2?8/3:4,ph:i*1.7,ax:3+(i%3)*1.5,ay:5+(i%4)*1.5}));
const wch=[...c6.querySelectorAll('.ch')];
const band=c1.querySelector('.band'),htx=c1.querySelector('.tx2'),m1=c2.querySelector('#m1'),m2=c2.querySelector('#m2'),o1=c3.querySelector('#o1'),o2=c3.querySelector('#o2');
const tyl=[...c4.querySelectorAll('.tyl')];
window.setT=t=>{
  // 01：4 秒一輪，0.3s 起劃 0.55s，2.6s 收回
  {const u=t%4;let k=ease3(cl((u-.3)/.55));if(u>2.6)k=1-ease3(cl((u-2.6)/.45));band.style.transform=`scaleX(${k})`;htx.style.clipPath=`inset(0 ${(1-k)*100}% 0 0)`;}
  // 02：4 秒一輪，0.9s 強烈減速合成，停留，3.4s 淡出
  {const u=t%4,k=ease5(cl(u/.9)),o=Math.min(cl(u/.5),1-cl((u-3.4)/.5));m1.style.transform=`translateX(${-35*(1-k)}%)`;m2.style.transform=`translateX(${35*(1-k)}%)`;m1.style.opacity=m2.style.opacity=o;}
  // 03：4 秒一輪，第一行填滿 → 換第二行（第一行從右往左退），最後第二行退回
  {const u=t%4;let a=io(cl((u-.3)/.6));if(u>1.6)a=1-io(cl((u-1.6)/.6));let b=io(cl((u-1.6)/.6));if(u>3.2)b=1-io(cl((u-3.2)/.6));
   o1.style.backgroundSize=`${a*100}% 100%`;o1.style.backgroundPosition=u>1.6?'100% 0':'0 0';
   o2.style.backgroundSize=`${b*100}% 100%`;o2.style.backgroundPosition=u>3.2?'100% 0':'0 0';}
  // 04：8 秒一輪，三行依序打出、停留，7.4s 起淡出
  {let u=t%8;const fade=1-cl((u-7.4)/.5);let cur=-1;
   tyl.forEach((el,k)=>{const c=[...LINES[k]],ty=c.length*.06;let n;
     if(u<0)n=0;else if(u<ty){n=Math.floor(u/.06);cur=k}else{n=c.length;if(cur<0&&k===tyl.length-1)cur=k}
     u-=ty+.35;el.style.opacity=(n>0||cur===k?1:0)*fade;
     el.querySelector('.tw').innerHTML=c.slice(0,Math.min(n,4)).join('')+'<span class="k">'+c.slice(4,n).join('')+'</span>';});
   tyl.forEach((el,k)=>{el.querySelector('.cur').style.opacity=(k===cur&&Math.floor(t*2)%2===0)?1:0});}
  // 05：漂浮
  fch.forEach(c=>{const w=2*Math.PI*t/c.p+c.ph;c.e.style.transform=`translate(${Math.sin(w+1.3)*c.ax}px,${Math.sin(w)*c.ay}px) rotate(${Math.sin(2*w)*4}deg)`});
  // 06：波浪，8/6 秒一個波
  wch.forEach((e,i)=>{const w=2*Math.PI*t/(8/6)-i*.55;e.style.transform=`translateY(${-Math.max(0,Math.sin(w))*18}px) rotate(${Math.sin(w)*5}deg)`});
};
</script>
